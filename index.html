<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахматы — играй онлайн</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gradW" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f4ecda"/>
      <stop offset="1" stop-color="#c8b691"/>
    </linearGradient>
    <linearGradient id="gradB" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5d6875"/>
      <stop offset="0.45" stop-color="#2a323c"/>
      <stop offset="1" stop-color="#0c1015"/>
    </linearGradient>
  </defs>
</svg>
<div class="app">
  <header class="top">
    <h1>♞ Шахматы</h1>
    <p class="sub">Полные правила · два игрока · против ИИ</p>
  </header>

  <main class="main">
    <div class="board-area">
      <div class="coords">
        <div id="board" class="board" aria-label="Шахматная доска"></div>
        <div id="promo" class="promo hidden" aria-label="Выбор фигуры для превращения"></div>
      </div>
    </div>

    <aside class="panel">
      <div id="status" class="status">Ход белых</div>

      <label class="field">Режим игры
        <select id="mode">
          <option value="pvp">Два игрока (на одном экране)</option>
          <option value="ai-b" selected>Против ИИ — я белые</option>
          <option value="ai-w">Против ИИ — я чёрные</option>
        </select>
      </label>

      <label class="field">Сложность ИИ
        <select id="level">
          <option value="1">Лёгкий (1 полуход)</option>
          <option value="2" selected>Средний (2 полухода)</option>
          <option value="3">Сложный (3 полухода)</option>
        </select>
      </label>

      <div class="buttons">
        <button id="new" class="primary">Новая игра</button>
        <button id="undo">Отменить ход</button>
        <button id="flip">Перевернуть доску</button>
      </div>

      <div class="moves">
        <div class="moves-title">Ходы</div>
        <ol id="movelist" class="movelist"></ol>
      </div>

      <p class="hint">Клик по фигуре — подсветятся возможные ходы. Рокировка, взятие на проходе и превращение поддержаны.</p>
    </aside>
  </main>
</div>

<svg class="svg-defs" aria-hidden="true">
  <defs>
    <linearGradient id="gradW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f5f9"/>
      <stop offset="1" stop-color="#c2ccd9"/>
    </linearGradient>
    <linearGradient id="gradB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5a6b"/>
      <stop offset="0.5" stop-color="#28313d"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
  </defs>
</svg>

<script src="chess.js"></script>
</body>
</html>
