<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахматы — играй онлайн</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1>♞ Шахматы</h1>
    <p class="sub">Полные правила · два игрока · против ИИ</p>
  </header>

  <main class="main">
    <div class="board-area">
      <div class="coords">
        <div id="board" class="board" aria-label="Шахматная доска"></div>
        <div id="promo" class="promo hidden" aria-label="Выбор фигуры для превращения"></div>
      </div>
    </div>

    <aside class="panel">
      <div id="status" class="status">Ход белых</div>

      <label class="field">Режим игры
        <select id="mode">
          <option value="pvp">Два игрока (на одном экране)</option>
          <option value="ai-b" selected>Против ИИ — я белые</option>
          <option value="ai-w">Против ИИ — я чёрные</option>
        </select>
      </label>

      <label class="field">Сложность ИИ
        <select id="level">
          <option value="1">Лёгкий (1 полуход)</option>
          <option value="2" selected>Средний (2 полухода)</option>
          <option value="3">Сложный (3 полухода)</option>
        </select>
      </label>

      <div class="buttons">
        <button id="new" class="primary">Новая игра</button>
        <button id="undo">Отменить ход</button>
        <button id="flip">Перевернуть доску</button>
      </div>

      <div class="moves">
        <div class="moves-title">Ходы</div>
        <ol id="movelist" class="movelist"></ol>
      </div>

      <p class="hint">Клик по фигуре — подсветятся возможные ходы. Рокировка, взятие на проходе и превращение поддержаны.</p>
    </aside>
  </main>
</div>

<script src="chess.js"></script>
</body>
</html>
